[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py-bqe"
version = "0.1.0"
description = "Bayesian Quantal Estimation from trains of synaptic responses (JAX / NumPyro)"
readme = "README.md"
license = "GPL-3.0-only"
authors = [
    { name = "Apostolos Mikroulis", email = "apostolos.mikroulis@outlook.com" },
]
requires-python = ">=3.12"
dependencies = [
    "jax>=0.4.30",
    "numpyro>=0.15.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/AMikroulis/py-BQE"

[project.scripts]
bqe = "bqe.__main__:cli"

[tool.setuptools.packages.find]
where = ["src"]
